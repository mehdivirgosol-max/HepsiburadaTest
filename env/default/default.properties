# Gauge çalışma ayarları. Kimlik bilgileri bu dosyaya yazılmaz.
gauge_reports_dir = reports
overwrite_reports = true
screenshot_on_failure = true
logs_directory = logs
gauge_specs_dir = specs
gauge_concepts_dir = specs/concepts
enable_multithreading = false
allow_multiline_step = false

# Reflection taramasını yalnızca proje adım/hook paketleriyle sınırlar.
package_to_scan = com.virgosol.hepsiburada

# Windows'ta Gauge Java alt sürecinin Türkçe adımları UTF-8 olarak okumasını sağlar.
JAVA_TOOL_OPTIONS = -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8
